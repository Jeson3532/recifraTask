services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-main
    ports:
      - "8000:8000"
#    expose:
#      - "8000"
    environment:
      - PYTHONPATH=.
    env_file:
      - .env
    volumes:
#      - ".:/app"
      - "./models:/app/models"
      - "./static:/app/static"
    restart: always
    depends_on:
      - db
  db:
    image: postgres:18
    container_name: postgres-main
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: